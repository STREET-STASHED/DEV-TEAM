name: Auto-Assign Orders
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cron Endpoint
        run: |
          echo "Calling cron endpoint..."
          curl -X POST "${{ secrets.CRON_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Log Execution
        run: |
          echo "Cron job executed at $(date)"
          echo "Called endpoint: ${{ secrets.CRON_URL }}"
