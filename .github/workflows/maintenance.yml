name: Database Maintenance
# Trigger GitHub Actions to recognize this workflow

on:
  schedule:
    # Daily at 2 AM UTC - Materialized view refresh
    - cron: "0 2 * * *"
    # Monthly on 1st at 3 AM UTC - Partition management
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      maintenance_type:
        description: "Type of maintenance to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - monthly

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.maintenance_type == 'daily')
    steps:
      - name: Run Daily Maintenance
        run: |
          curl -X POST "https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/maintenance" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  monthly-maintenance:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.maintenance_type == 'monthly')
    steps:
      - name: Run Monthly Maintenance
        run: |
          curl -X POST "https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/monthly-maintenance" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [daily-maintenance, monthly-maintenance]
    if: failure()
    steps:
      - name: Notify on Failure
        run: |
          echo "Maintenance job failed. Check the logs for details."
          # Add your notification logic here (Slack, email, etc.)
