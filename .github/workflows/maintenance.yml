name: Database Maintenance
on:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      maintenance_type:
        description: "Type of maintenance to run"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - monthly

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Run Daily Maintenance
        if: github.event.inputs.maintenance_type == 'daily' || github.event.schedule == '0 2 * * *'
        run: |
          echo "Running daily maintenance..."
          curl -X POST "https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/maintenance" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run Monthly Maintenance
        if: github.event.inputs.maintenance_type == 'monthly'
        run: |
          echo "Running monthly maintenance..."
          curl -X POST "https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/monthly-maintenance" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Log Execution
        run: |
          echo "Maintenance job executed at $(date)"
          echo "Maintenance type: ${{ github.event.inputs.maintenance_type || 'scheduled' }}"
