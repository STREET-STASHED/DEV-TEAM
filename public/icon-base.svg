<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)" stroke="#1e40af" stroke-width="8"/>
  
  <!-- Inner circle for icon area -->
  <circle cx="512" cy="512" r="400" fill="url(#iconGradient)" opacity="0.95"/>
  
  <!-- StreetStashed Icon Design -->
  <!-- S for Street -->
  <path d="M 350 300 Q 350 250 400 250 L 500 250 Q 550 250 550 300 Q 550 350 500 350 L 400 350 Q 350 350 350 400 Q 350 450 400 450 L 500 450 Q 550 450 550 500 Q 550 550 500 550 L 400 550 Q 350 550 350 600" 
        fill="none" stroke="#3b82f6" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Stylized hanger/rack -->
  <path d="M 650 300 L 650 500 M 600 300 L 700 300 M 600 500 L 700 500" 
        fill="none" stroke="#3b82f6" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Small clothing items -->
  <circle cx="600" cy="400" r="15" fill="#3b82f6"/>
  <circle cx="700" cy="400" r="15" fill="#3b82f6"/>
  <circle cx="650" cy="450" r="15" fill="#3b82f6"/>
  
  <!-- App name text -->
  <text x="512" y="750" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#1e40af">STREETSTASHED</text>
  
  <!-- Tagline -->
  <text x="512" y="800" font-family="Arial, sans-serif" font-size="24" 
        text-anchor="middle" fill="#6b7280">MARKETPLACE</text>
</svg>
